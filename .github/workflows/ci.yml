name: CI

# Runs the existing Django test suite against a real Postgres service
# container on every push/PR to master -- the same DB engine production
# uses, so a migration or query that only breaks under Postgres (not
# SQLite) gets caught here instead of on the Mini PC.
#
# Also runs the DevSecOps gate: secret scanning (gitleaks), dependency
# vulnerability scanning (pip-audit), and Django's own deploy security
# checklist (manage.py check --deploy). All three are REQUIRED before
# `deploy` runs -- this exists because demo/mcp.env got committed with
# real secrets straight to master with nothing to catch it (see git
# history around 2026-10-15). secret-scan is what would have caught that.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No DJANGO_SECRET_KEY / DJANGO_DEBUG needed for the test suite itself
      # -- main/settings.py's TESTING flag (set automatically by `manage.py
      # test`) already relaxes the production-only requirements for exactly
      # this case. The deploy-check step below runs as `check`, not `test`,
      # so it gets its own SECRET_KEY further down.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python manage.py test

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Django deploy security check
        env:
          # CI-only throwaway value -- never used anywhere real, just long
          # and random enough to satisfy check --deploy's SECRET_KEY
          # strength check (security.W009). Real deployments set their own
          # DJANGO_SECRET_KEY in .env (see infra/bootstrap.ps1).
          DJANGO_SECRET_KEY: "ci-only-9f3a1e7c5b2d8f04a6e9c1b7d3f5a8e2c4b6d9f1a3e5c7b9d1f3a5c7e9b1d3f5"
        run: python manage.py check --deploy --fail-level WARNING

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs real history to scan, not just the latest commit

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed -- that's only required for
          # organization-owned repos; this one's on a personal account.

  deploy:
    needs: [test, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh

    # Runs on the Mini PC itself, via the self-hosted runner registered
    # there. Deliberately no actions/checkout step: this operates on the
    # one real production clone (git fetch + reset, not a fresh checkout
    # into the runner's own _work folder), since that's the clone with
    # the real .env and the Postgres/static/media volumes docker-compose
    # expects to find next to it.
    steps:
      - name: Pull latest master
        run: |
          cd "C:\Users\meridian\Desktop\InventoryManagement"
          git fetch origin
          git reset --hard origin/master

      - name: Back up before deploying
        run: |
          cd "C:\Users\meridian\Desktop\InventoryManagement"
          python backup.py

      - name: Rebuild and restart
        run: |
          cd "C:\Users\meridian\Desktop\InventoryManagement"
          docker compose up -d --build web
          docker compose ps
