name: CI

# Runs the existing Django test suite against a real Postgres service
# container on every push/PR to master -- the same DB engine production
# uses, so a migration or query that only breaks under Postgres (not
# SQLite) gets caught here instead of on the Mini PC.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No DJANGO_SECRET_KEY / DJANGO_DEBUG needed -- main/settings.py's
      # TESTING flag (set automatically by `manage.py test`) already
      # relaxes the production-only requirements for exactly this case.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python manage.py test
