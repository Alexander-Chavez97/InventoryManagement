# Automatic PRs for outdated/vulnerable dependencies. This is the "nobody
# has to remember to check" half of the DevSecOps dependency story --
# pip-audit in ci.yml is the "catch it in CI" half.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
