<select name="subcategory" id="id_subcategory" required
        hx-get="{% url 'inventory:subsubcategory_options' %}"
        hx-target="#subsubcategory-wrapper"
        hx-swap="innerHTML"
        hx-trigger="change">
  <option value="">Select a subcategory…</option>
  {% for sub in subcategories %}
  <option value="{{ sub.pk }}">{{ sub.name }}</option>
  {% endfor %}
</select>
<select name="subsubcategory" id="id_subsubcategory" hx-swap-oob="true" required>
  <option value="">Select a subcategory first…</option>
</select>
